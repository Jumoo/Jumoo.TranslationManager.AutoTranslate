version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # Jumoo.TranslationManager.Core is pinned deliberately in the csproj - it's the minimum
    # version anyone installing this sample needs, and it moves when we choose to move it,
    # not on a weekly schedule. Note this also opts it out of dependabot security updates.
    ignore:
      - dependency-name: "Jumoo.*"
    # majors are deliberately left out of the group so they arrive as one PR each.
    groups:
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # gittools/actions v4 requires GitVersion >= 6.2, which needs GitVersion.yml migrating
    # to the v6 schema. Dependabot can't see that the action version and the versionSpec
    # input are coupled, so it broke a release build once already in a sibling repo. Unpin
    # this when we do the GitVersion 6 migration deliberately.
    ignore:
      - dependency-name: "gittools/actions"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
